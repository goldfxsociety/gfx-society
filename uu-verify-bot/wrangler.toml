# Universe Unlimited onboarding bot — Cloudflare Worker config (Workers Free plan + D1 free tier).
# A SEPARATE Worker from gfx-discord-verify-bot (PDE GFX Verifier). Never deploy this config over that worker.
# Nothing in this file is secret. Secrets are set on the Worker only:
#   npx wrangler secret put DISCORD_PUBLIC_KEY
#   npx wrangler secret put DISCORD_BOT_TOKEN

name = "uu-verify-bot"
main = "src/index.ts"
compatibility_date = "2026-04-20"
workers_dev = true
# Explicitly off: wrangler would otherwise enable Preview URLs by default when workers_dev is on.
preview_urls = false

# Every 5 minutes. Each tick runs, in order and under one budget of 45 subrequests (Discord + CDN + D1, Free cap 50):
#  1st-of-month VIP reset (Asia/Manila) → 7-day-before reminder DMs → leftover review-card cleanup → 48h escalation.
# Monthly jobs are idempotent per Manila YYYY-MM (cron_runs) and resume across ticks via phase + cursor.
[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true

# Free, separate storage. Zero dependency on GFX prod Supabase.
# Create once with:  npx wrangler d1 create uu-verify-bot   then paste the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "uu-verify-bot"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# Discord application (public ids).
DISCORD_APP_ID = "1573941065491152956"
GUILD_ID = "1572501982944559124"
# Role ids: printed by `npm run setup-server -- --apply` (also written to setup.out.json).
ADMIN_ROLE_IDS = "REPLACE_WITH_ADMIN_MOD_ROLE_ID"
COACH_ROLE_ID = "REPLACE_WITH_COACH_ROLE_ID"
UNVERIFIED_ROLE_ID = "REPLACE_WITH_UNVERIFIED_ROLE_ID"
FREE_ROLE_ID = "REPLACE_WITH_FREE_ROLE_ID"
VIP_ROLE_ID = "REPLACE_WITH_VIP_ROLE_ID"
SUB_IB_ROLE_ID = "REPLACE_WITH_SUB_IB_ROLE_ID"
# Channel ids (setup output).
VERIFY_CHANNEL_ID = "REPLACE_WITH_VERIFY_CHANNEL_ID"
ADMIN_LOG_CHANNEL_ID = "REPLACE_WITH_ADMIN_LOG_CHANNEL_ID"
# Optional: category for auto-created #review-{line} channels (setup output "REVIEWS" category). Empty = no category.
REVIEW_CATEGORY_ID = ""
# Coach Mike has two Discord accounts. ONE Coach Mike line; both accounts review for it (comma-separated).
COACH_MIKE_DISCORD_USER_IDS = "1317701669768925188,1417055027121619004"
# Ben (GFX line owner; gets Admin / Mod at setup).
BEN_DISCORD_USER_ID = "502826848812531712"
# Max screenshot size in bytes (also capped by Discord's attachment_size_limit). 8 MiB.
MAX_UPLOAD_BYTES = "8388608"
